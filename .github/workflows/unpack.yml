name: Unpack site zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join and extract
        run: |
          ls -la _upload
          cat _upload/site.zip.part* > /tmp/site.zip
          unzip -o /tmp/site.zip -d .
          git rm -r -q _upload
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "REV000 (261104): extract site files"
          git push
