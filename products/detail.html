<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Product Detail | Bioprotech</title>
<link href="../Bioprotech Design System/colors_and_type.css" rel="stylesheet"/>
<link href="../assets/css/site.css" rel="stylesheet"/>
<style>
  .detail-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 64px;
    align-items: start;
  }
  .gallery .main-img {
    height: 420px;
  }
  .gallery .thumbs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .gallery .thumbs .placeholder-img { min-height: 80px; }
  .info .name {
    font-size: 32px; font-weight: 700;
    color: var(--bp-accent5); line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .info .name .en {
    display: block; font-size: 13px; font-weight: 400;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--bp-dk2); opacity: 0.7; margin-top: 10px;
  }
  .info .tag {
    font-size: 14px; line-height: 1.75;
    color: var(--bp-dk2); opacity: 0.85;
    margin-bottom: 24px;
  }
  .spec-block { margin-top: 32px; }
  .spec-block h3 {
    font-size: 13px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--bp-accent5);
    margin-bottom: 12px; font-weight: 700;
  }
  .spec-table {
    width: 100%;
    border-top: 1px solid var(--bp-lt2);
  }
  .spec-table tr { border-bottom: 1px solid var(--bp-lt2); }
  .spec-table th, .spec-table td {
    padding: 14px 16px;
    text-align: left;
    font-size: 13px;
    vertical-align: top;
  }
  .spec-table th {
    width: 40%;
    background: #F7F8FA;
    font-weight: 700;
    color: var(--bp-dk2);
    letter-spacing: 0.05em;
  }
  .spec-table td { color: var(--bp-dk2); opacity: 0.9; }
  .actions { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
  .related { margin-top: 100px; }
  .related h3 {
    font-size: 20px; font-weight: 700; color: var(--bp-accent5);
    margin-bottom: 20px;
  }
  .rel-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--bp-lt2);
    border: 1px solid var(--bp-lt2);
  }
  .rel-card {
    background: #fff; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 140px; transition: background .2s;
  }
  .rel-card:hover { background: var(--bp-lt-bluegray); }
  .rel-card h4 { font-size: 13px; font-weight: 700; color: var(--bp-dk2); }
  .rel-card p { font-size: 11px; color: var(--bp-dk2); opacity: 0.7; margin-top: auto; }

  
  .gallery .main-img { height: 420px; border-radius: 0; background: #fff; border: 1px solid #e5e5ea; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .gallery .main-img img { max-width: 92%; max-height: 92%; object-fit: contain; mix-blend-mode: multiply; }
  .gallery .thumbs button { height: 80px; border: 1px solid #e5e5ea; border-radius: 10px; background: #fff; padding: 6px; cursor: pointer; }
  .gallery .thumbs button.on { border-color: #1d1d1f; }
  .gallery .thumbs img { width: 100%; height: 100%; object-fit: contain; }
  .catname { font-size: 12px; color: #6e6e73; margin-top: -14px; margin-bottom: 18px; }
  .desc { font-size: 15px; line-height: 1.8; color: #1d1d1f; margin-bottom: 18px; }
  .feat { margin: 0 0 8px; padding: 0; list-style: none; display: grid; gap: 8px; }
  .feat li { position: relative; padding-left: 18px; font-size: 14px; line-height: 1.65; color: #424245; }
  .feat li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--bp-accent5); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 12px; padding: 4px 10px; border-radius: 980px; background: #f5f5f7; color: #424245; }
  .models { margin-top: 72px; }
  .models h3 { font-size: 20px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
  .models .sub { font-size: 13px; color: #6e6e73; margin-bottom: 18px; }
  .mtable-wrap { overflow-x: auto; border: 1px solid #e5e5ea; border-radius: 14px; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  .mtable th { background: #f5f5f7; text-align: left; font-weight: 600; padding: 12px 14px; white-space: nowrap; color: #1d1d1f; border-bottom: 1px solid #e5e5ea; }
  .mtable td { padding: 11px 14px; border-bottom: 1px solid #f0f0f2; color: #424245; vertical-align: top; }
  .mtable tr:last-child td { border-bottom: 0; }
  .mtable td:first-child { font-weight: 600; color: #1d1d1f; white-space: nowrap; }
  .mfilter { margin-bottom: 12px; }
  .mfilter input { width: 100%; max-width: 320px; padding: 10px 14px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; font-size: 14px; }
  .dl-cat { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px solid #e5e5ea; border-radius: 14px; }
  .dl-cat img { width: 56px; height: 78px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .dl-cat b { display: block; font-size: 14px; color: #1d1d1f; }
  .dl-cat span { font-size: 12px; color: #6e6e73; }
  .dl-cat a { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--bp-accent5); white-space: nowrap; }
  
  .pk-row + .pk-row { margin-top: 18px; padding-top: 18px; border-top: 1px dashed #e5e5ea; }
  .pk-label { font-size: 13px; font-weight: 700; color: #1d1d1f; margin-bottom: 10px; }
  .pk-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; }
  .pk-steps li { position: relative; flex: 1 1 0; min-width: 92px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 14px 8px 12px; border: 1px solid #e5e5ea; background: #fff; }
  .pk-steps li + li { border-left: 0; }
  .pk-steps li + li::before { content: ''; position: absolute; left: -6px; top: 50%; width: 10px; height: 10px; margin-top: -5px; background: #fff; border-top: 1px solid #c7ccd6; border-right: 1px solid #c7ccd6; transform: rotate(45deg); }
  .pk-ic { color: #14306b; height: 30px; width: 30px; margin-bottom: 4px; }
  .pk-ic.pk-s0 { width: 22px; height: 22px; margin-top: 8px; } .pk-ic.pk-s1 { width: 26px; height: 26px; margin-top: 4px; }
  .pk-lv { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6e6e73; text-transform: uppercase; }
  .pk-steps b { font-size: 22px; font-weight: 800; color: #0a1428; line-height: 1.2; }
  .pk-steps b small { font-size: 12px; font-weight: 600; color: #424245; margin-left: 2px; }
  .pk-steps em { font-style: normal; font-size: 11px; color: #86868b; }
  .pk-steps li:last-child { background: #f5f7fb; }
  .pk-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid #e5e5ea; }
  .pk-list li { display: grid; grid-template-columns: 1fr auto 72px; align-items: baseline; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #e5e5ea; font-size: 14px; color: #1d1d1f; }
  .pk-list em { font-style: normal; font-size: 12px; color: #6e6e73; }
  .pk-list b { font-size: 18px; font-weight: 800; color: #0a1428; text-align: right; }
  .pk-list b small { font-size: 12px; font-weight: 600; color: #424245; margin-left: 2px; }
  @media (max-width: 600px) { .pk-steps li { min-width: 0; padding: 12px 4px 10px; } .pk-steps b { font-size: 18px; } }
  @media (max-width: 600px) {
    .spec-table, .spec-table tbody, .spec-table tr, .spec-table th, .spec-table td { display: block; width: 100%; }
    .spec-table th { background: none; padding: 14px 0 4px; font-size: 12px; color: #6e6e73; }
    .spec-table td { padding: 0 0 14px; font-size: 14px; }
    .chips span { background: none; padding: 0; border-radius: 0; font-size: 14px; color: #424245; }
    .chips { gap: 4px 12px; }
    .mtable-wrap { border: 0; border-radius: 0; overflow: visible; }
    .mtable { min-width: 0; }
    .mtable thead { display: none; }
    .mtable, .mtable tbody, .mtable tr, .mtable td { display: block; width: 100%; }
    .mtable tr { border-top: 1px solid #e5e5ea; padding: 12px 0; }
    .mtable td { border: 0; padding: 3px 0; display: grid; grid-template-columns: 96px 1fr; gap: 10px; white-space: normal !important; }
    .mtable td::before { content: attr(data-l); font-size: 11px; font-weight: 600; color: #86868b; padding-top: 2px; }
    .mtable td:first-child { font-size: 15px; }
    .dl-cat { flex-wrap: wrap; }
    .dl-cat > div { flex: 1 1 160px; min-width: 0; }
    .dl-cat b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .dl-cat a { margin-left: 72px; }
  }
  @media (max-width: 900px) {
    .detail-grid { grid-template-columns: 1fr; gap: 32px; }
    .rel-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<link href="../assets/css/theme-apple.css" rel="stylesheet"/>
</head>
<body data-base=".." data-lang="en" data-nav="products">
<div id="bp-header-slot"></div>
<section class="page-hero">
<nav class="breadcrumb">
<a href="index.html">Products</a>
<span class="sep">/</span>
<a href="#" id="crumb-cat"></a>
<span class="sep">/</span>
<span id="crumb-prod"></span>
</nav>
<h1 id="prod-h1"></h1>
</section>
<main class="page-body">
<div class="detail-grid">
<div class="gallery">
<div class="main-img" id="main-img"><div class="placeholder-img" data-label="Image pending" style="width:100%;height:100%"></div></div>
<div class="thumbs" id="thumbs"></div>
</div>
<div class="info">
<div class="name" id="name-block"> </div>
<div id="desc-wrap"></div>
<div class="spec-block">
<h3>Specifications</h3>
<table class="spec-table"><tbody id="spec-body"></tbody></table>
</div>
<div class="spec-block" hidden="" id="pack-block">
<h3>Packaging</h3>
<div id="pack-wrap"></div>
</div>
<div class="spec-block">
<h3>Downloads</h3>
<div id="dl-wrap"></div>
</div>
<div class="actions">
<a class="btn btn-primary" href="../support/contact.html?subject=quote" id="quote-btn">
<span class="en-only">Get a Quote</span> <span class="arrow">→</span>
</a>
<a class="btn btn-ghost" href="../downloads/index.html" id="cat-btn"><span class="en-only">Download Catalog</span></a>
</div>
</div>
</div>
<section class="models" hidden="" id="models">
<h3 id="models-title">Models</h3>
<p class="sub" id="models-sub"></p>
<div class="mfilter"><input id="mfilter" type="search"/></div>
<div class="mtable-wrap"><table class="mtable" id="mtable"></table></div>
<div id="acc-wrap"></div>
</section>
<section class="related">
<h3 id="related-title">Related Products</h3>
<div class="rel-grid" id="rel-grid"></div>
</section>
<script>
    // Localize static phrase when lang is KO (EN handled by existing inline script)
    (function(){ if (window.bpLang && window.bpLang()==='ko') {
      document.getElementById('related-title').textContent = 'Related Products';
    }})();
  </script>
</main>
<div id="bp-footer-slot"></div>
<script src="../assets/js/data-bundle.js"></script>
<script src="../assets/js/chrome.js"></script>
<script>
(async function () {
  
  const ALIAS = { 'ecg-electrode': 'ecg-monitoring' };
  const id = ALIAS[window.bpQuery('id')] || window.bpQuery('id');
  if (!id) { location.replace('index.html'); return; }

  const res = await fetch('../assets/data/products.json');
  const data = await res.json();
  const lang = window.bpLang();
  const prod = data.products.find(p => p.id === id);
  if (!prod) {
    document.getElementById('prod-h1').textContent = 'Not Found';
    return;
  }
  const cat = data.categories.find(c => c.id === prod.cat);

  document.title = `${prod.name[lang]} | Bioprotech`;
  const L = (ko, en, es) => lang === 'ko' ? ko : lang === 'es' ? (es || en) : en;
  const tx = o => o ? (o[lang] || o.en || o.ko || '') : '';
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('crumb-cat').textContent = cat.name[lang];
  document.getElementById('crumb-cat').href = `category.html?cat=${cat.id}`;
  document.getElementById('crumb-prod').textContent = prod.name[lang];
  document.getElementById('prod-h1').textContent = prod.name[lang];
  document.getElementById('name-block').firstChild.nodeValue = prod.name[lang];
  document.getElementById('quote-btn').href = `../support/contact.html?subject=quote&product=${encodeURIComponent(prod.name.en)}`;

  
  const imgs = prod.images || [];
  if (imgs.length) {
    const main = document.getElementById('main-img');
    const show = k => {
      main.innerHTML = `<img src="../assets/img/products/${imgs[k]}" alt="${esc(prod.name[lang])}">`;
      document.querySelectorAll('#thumbs button').forEach((b, n) => b.classList.toggle('on', n === k));
    };
    document.getElementById('thumbs').innerHTML = imgs.length > 1 ? imgs.map((f, k) =>
      `<button type="button" data-k="${k}" aria-label="image ${k+1}"><img src="../assets/img/products/${f}" alt=""></button>`).join('') : '';
    document.getElementById('thumbs').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); };
    show(0);
  }

  
  const dw = document.getElementById('desc-wrap');
  if (prod.summary) {
    const feats = (prod.features && (prod.features[lang] || prod.features.en)) || [];
    dw.innerHTML = `<p class="desc">${esc(tx(prod.summary))}</p>` +
      (feats.length ? `<ul class="feat">${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '');
  } else {
    dw.innerHTML = `<div class="placeholder-empty"><strong>${L('Product Description','Product Description','Descripción del producto')}</strong>${L('Details will be added once the catalog for this product is available.','Details will be added once the catalog for this product is available.','Los detalles se añadirán cuando el catálogo esté disponible.')}</div>`;
  }

  
  const rows = [];
  if (prod.spec && prod.spec.rows) rows.push([L('Models','Models','Modelos'), `${prod.spec.rows.length} ${L('models','models','modelos')}`]);
  if (prod.keyspecs) Object.entries(prod.keyspecs).forEach(([k, v]) => rows.push([k, v]));
  if (prod.material) rows.push([L('Material','Material','Material'), prod.material]);
  if (prod.packing && !prod.pack) rows.push([L('Packing Unit','Packing Unit','Embalaje'), prod.packing]);
  if (prod.applications && prod.applications.length) rows.push([L('Applications','Applications','Aplicaciones'), `<div class="chips">${prod.applications.map(a => `<span>${esc(a)}</span>`).join('')}</div>`]);
  document.getElementById('spec-body').innerHTML = rows.length
    ? rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${String(v).startsWith('<div') ? v : esc(v)}</td></tr>`).join('')
    : `<tr><th>${L('Specifications','Specifications','Especificaciones')}</th><td>${L('Catalog in preparation','Catalog in preparation','Catálogo en preparación')}</td></tr>`;


  
  if (prod.pack && prod.pack.length) {
    const LV = {
      each:{ko:'Each',en:'Each',es:'Unidad'}, pack:{ko:'Pack',en:'Pack',es:'Paquete'}, pouch:{ko:'Pouch',en:'Pouch',es:'Bolsa'},
      card:{ko:'Card',en:'Card',es:'Tarjeta'}, bag:{ko:'Bag',en:'Bag',es:'Bolsa'}, box:{ko:'Box',en:'Box',es:'Caja'}, inbox:{ko:'Inner box',en:'Inner box',es:'Caja interior'},
      hardcase:{ko:'Hard case',en:'Hard case',es:'Estuche rígido'}, case:{ko:'Case',en:'Case',es:'Caja máster'} };
    const UN = { pc:{ko:'pcs',en:'pcs',es:'uds.'}, pair:{ko:'pairs',en:'pairs',es:'pares'}, unit:{ko:'units',en:'units',es:'uds.'} };
    const IC = {
      each:'<rect x="9" y="9" width="6" height="6" rx="1.5"/>',
      pack:'<path d="M6 5h12l-1 14H7z"/><path d="M6 8h12"/>', bag:'<path d="M6 4h12v16H6z"/><path d="M6 8h12"/>', pouch:'<path d="M6 5h12l-1 14H7z"/><path d="M6 8h12"/>',
      card:'<rect x="5" y="6" width="14" height="12" rx="1.5"/><circle cx="9" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15" cy="12" r="1"/>',
      box:'<path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/>', inbox:'<path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/>',
      hardcase:'<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M9 7V5h6v2"/>',
      case:'<path d="M2 7h20v13H2z"/><path d="M2 7l3-3h14l3 3M10 7v4h4V7"/>' };
    const num = n => typeof n === 'number' ? n.toLocaleString('en-US') : esc(n);
    const single = prod.pack.every(v => v.steps.length === 1);
    if (single) document.getElementById('pack-wrap').innerHTML = `<ul class="pk-list">${prod.pack.map(v => { const [lv, n, u] = v.steps[0];
      return `<li><span>${esc(tx(v.label))}</span><em>${tx(LV[lv])}</em><b>${num(n)}<small>${tx(UN[u])}</small></b></li>`; }).join('')}</ul>`;
    else document.getElementById('pack-wrap').innerHTML = prod.pack.map(v => `
      <div class="pk-row">${v.label ? `<div class="pk-label">${esc(tx(v.label))}</div>` : ''}
        <ol class="pk-steps">${v.steps.map(([lv, n, u], k) => {
          const prev = k ? v.steps[k - 1] : null;
          const r = prev && typeof n === 'number' && typeof prev[1] === 'number' ? n / prev[1] : 0;
          const comp = prev && Number.isInteger(r) && r > 1 ? (lang === 'ko' ? `${r}${LV[prev[0]].ko}` : `${r} × ${tx(LV[prev[0]])}`) : '';
          return `<li><svg viewBox="0 0 24 24" class="pk-ic pk-s${Math.min(k,3)}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">${IC[lv] || IC.box}</svg>
            <span class="pk-lv">${tx(LV[lv])}</span><b>${num(n)}<small>${tx(UN[u])}</small></b>${comp ? `<em>${comp}</em>` : ''}</li>`;
        }).join('')}</ol>
      </div>`).join('');
    document.getElementById('pack-block').hidden = false;
  }

  
  const dl = document.getElementById('dl-wrap');
  if (prod.catalog) {
    const f = prod.catalog.file, cover = f.replace('.pdf', '-cover.jpg');
    dl.innerHTML = `<div class="dl-cat"><img src="../assets/catalog/${cover}" alt=""><div><b>${esc(prod.catalog.name || f)}</b><span>PDF · ${L('Product catalog','Product catalog','Catálogo')}</span></div><a href="../assets/catalog/${f}" target="_blank" rel="noopener">${L('View catalog','View catalog','Ver catálogo')} ↗</a></div>`;
    const cb = document.getElementById('cat-btn'); cb.href = `../assets/catalog/${f}`; cb.setAttribute('download', '');
  } else {
    dl.innerHTML = `<p style="font-size:13px;color:#6e6e73">${L('Catalog in preparation.','Catalog in preparation.','Catálogo en preparación.')}</p>`;
  }

  
  if (prod.spec && prod.spec.rows && prod.spec.rows.length) {
    const sec = document.getElementById('models'); sec.hidden = false;
    document.getElementById('models-title').textContent = L('Model Specifications','Model Specifications','Especificaciones de modelos');
    document.getElementById('models-sub').textContent = L(`${prod.spec.rows.length} models per catalog`, `${prod.spec.rows.length} models per catalog`, `${prod.spec.rows.length} modelos según catálogo`);
    const inp = document.getElementById('mfilter');
    inp.placeholder = L('Search model or spec', 'Search model or spec', 'Buscar modelo');
    const tbl = document.getElementById('mtable');
    const draw = q => {
      const rs = prod.spec.rows.filter(r => !q || r.join(' ').toLowerCase().includes(q.toLowerCase()));
      tbl.innerHTML = `<thead><tr>${prod.spec.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
        (rs.map(r => `<tr>${r.map((c,i) => `<td data-l="${esc(prod.spec.columns[i]||'')}">${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${prod.spec.columns.length}">${L('No matching models.','No matching models.','Sin resultados.')}</td></tr>`) + '</tbody>';
    };
    inp.oninput = () => draw(inp.value.trim()); draw('');
    if (prod.accessories) {
      const a = prod.accessories;
      document.getElementById('acc-wrap').innerHTML = `<h3 style="margin-top:40px">${L('Accessories','Accessories','Accesorios')}</h3><div class="mtable-wrap" style="margin-top:14px"><table class="mtable"><thead><tr>${a.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${a.rows.map(r => `<tr>${r.map((c,i) => `<td data-l="${esc(a.columns[i]||'')}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
  }

  if (lang === 'en') {
    document.getElementById('related-title').textContent = 'Related Products';
  } else if (lang === 'es') {
    document.getElementById('related-title').textContent = 'Productos relacionados';
  }

  const related = data.products
    .filter(p => p.cat === prod.cat && p.id !== prod.id)
    .slice(0, 4);

  document.getElementById('rel-grid').innerHTML = related.map(p => `
    <a class="rel-card" href="detail.html?id=${p.id}">
      ${p.images ? `<img src="../assets/img/products/${p.images[0]}" alt="" style="height:90px;object-fit:contain;mix-blend-mode:multiply">` : ''}
      <h4>${p.name[lang]}</h4>
      <p>${p.tagline[lang]}</p>
    </a>
  `).join('');
})();
</script>
</body>
</html>
